<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NYC Survive</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game"></canvas>

    <div id="menu">
        <button class="theme-toggle" id="menu-theme" type="button">Theme</button>
        <div class="menu-title">NYC SURVIVE</div>
        <div class="menu-subtitle">Times Square Survival Simulator</div>
        <div class="difficulty-picker" id="difficulty-picker">
            <button class="diff-btn" data-diff="easy">EASY</button>
            <button class="diff-btn" data-diff="medium">MEDIUM</button>
            <button class="diff-btn" data-diff="hard">HARD</button>
        </div>
        <button class="menu-btn" id="menu-new">NEW GAME</button>
        <div class="menu-load-title">LOAD GAME</div>
        <div id="menu-slots"></div>
    </div>

    <div id="hud">
        <div id="resource-bar"></div>
        <div id="build-menu"></div>
        <div id="colonist-panel"></div>
        <div id="game-log"></div>
        <div id="time-display"></div>
        <div id="minimap-container">
            <canvas id="minimap" width="150" height="150"></canvas>
        </div>
    </div>

    <div id="pause-overlay"></div>
    <div id="save-indicator">SAVED</div>
    <div id="settings-overlay"></div>
    <div id="tutorial-overlay"></div>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/webmcp.js"></script>
</body>
</html>
