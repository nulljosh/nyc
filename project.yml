name: NYCSurvive
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
settings:
  DEVELOPMENT_TEAM: QMM486NPYC
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "3"
targets:
  NYCSurvive:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "AppiOS/**"
      - path: Resources
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.nyc
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: "NYC Survive"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
      CODE_SIGN_ENTITLEMENTS: Resources/NYCSurvive.entitlements
      ENABLE_HARDENED_RUNTIME: YES
  NYCSurvive-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "App/**"
          - "AppiOS/**"
      - path: Sources/AppiOS
      - path: Resources
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.nyc.ios
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: "NYC Survive"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      TARGETED_DEVICE_FAMILY: "1,2"
  SimTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: NYCSurvive
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.nyc.tests
      GENERATE_INFOPLIST_FILE: YES
